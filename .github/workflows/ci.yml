name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rail-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install check tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check app tests scripts/bundle_stations.py
      - name: Pytest
        run: python -m pytest -q
      - name: Set up Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3
      - name: Docker Hub login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tag
        if: github.event_name == 'push'
        id: tag
        run: echo "sha=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rail:main
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/rail:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
