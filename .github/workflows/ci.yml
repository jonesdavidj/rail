name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check app tests scripts/bundle_stations.py
      - run: python -m ruff format --check app tests scripts/bundle_stations.py
      - run: python -m pytest
      - name: Audit runtime dependencies
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements.txt --disable-pip --no-deps
      - name: Validate Compose
        env:
          RAIL_IMAGE: jonesdavidj/rail:test
          RAIL_PLATFORM: linux/amd64
          RAIL_HOST_PORT: '8097'
          RAIL_VOLUME_NAME: rail-data
          RAIL_DATA_PATH: /data
          RAIL_PROVIDER: demo
          RAIL_DATA_BASE_URL: ''
          RAIL_DATA_ALLOWED_HOSTS: api1.raildata.org.uk
          RAIL_DATA_API_KEY: ''
          RAIL_DATA_API_KEY_FILE: ''
          ADMIN_TOKEN: ''
          RAIL_CACHE_TTL: '30'
          RAIL_REFRESH_SECONDS: '30'
          TZ: Europe/London
        run: docker compose config --quiet
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 detect --source /repo --no-git --redact
      - name: Build image
        run: docker build -t rail:test .
      - name: Smoke test image with an empty named volume
        run: |
          docker volume create rail-ci-data
          docker run -d --name rail-ci -v rail-ci-data:/data -p 127.0.0.1:8097:8080 rail:test
          trap 'docker logs rail-ci; docker rm -f rail-ci; docker volume rm rail-ci-data' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8097/api/health; then break; fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:8097/api/board?route=out' | python -c 'import json,sys; b=json.load(sys.stdin); assert b["demo"] and len(b["services"]) == 7'
# Publishing is deliberately deferred: phase 1 CI never pushes or deploys images.
