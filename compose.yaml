services:
  rail:
    image: docker.io/${DOCKERHUB_USERNAME:-jonesdavidj}/rail:${RAIL_IMAGE_TAG:-main}
    container_name: ${RAIL_CONTAINER_NAME:-rail}
    platform: ${RAIL_PLATFORM:-linux/amd64}
    restart: ${RAIL_RESTART_POLICY:-unless-stopped}
    environment:
      RAIL_PROVIDER: ${RAIL_PROVIDER:-demo}
      RAIL_DATA_PATH: ${RAIL_DATA_PATH:-/data}
      TZ: ${TZ:-Europe/London}
      RAIL_DATA_BASE_URL: ${RAIL_DATA_BASE_URL:-}
      RAIL_DATA_ALLOWED_HOSTS: ${RAIL_DATA_ALLOWED_HOSTS:-api1.raildata.org.uk}
      RAIL_DATA_API_KEY: ${RAIL_DATA_API_KEY:-}
      RAIL_DATA_API_KEY_FILE: ${RAIL_DATA_API_KEY_FILE:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RAIL_CACHE_TTL: ${RAIL_CACHE_TTL:-30}
      RAIL_REFRESH_SECONDS: ${RAIL_REFRESH_SECONDS:-30}
    networks:
      default:
      rail_ingress:
        aliases:
          - rail-origin
    # HA runs in the host namespace and calls 127.0.0.1:8098.
    ports:
      - "${RAIL_BIND_ADDRESS:-127.0.0.1}:${RAIL_HOST_PORT:-8098}:8097"
    volumes:
      - rail-data:/data
    read_only: ${RAIL_READ_ONLY:-true}
    tmpfs:
      - /tmp:size=${RAIL_TMP_SIZE:-16m},mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: ${RAIL_BACKEND_NETWORK:-rail-stack_default}
    driver: bridge
    ipam:
      config:
        - subnet: ${RAIL_BACKEND_SUBNET:-10.203.20.0/24}
          gateway: ${RAIL_BACKEND_GATEWAY:-10.203.20.1}
  rail_ingress:
    external: true
    name: rail_ingress

volumes:
  rail-data:
    name: ${RAIL_DATA_VOLUME:-rail-data}
    driver: local
