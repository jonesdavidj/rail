services:
  rail:
    image: ${RAIL_IMAGE}
    platform: ${RAIL_PLATFORM}
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      RAIL_DATA_PATH: ${RAIL_DATA_PATH}
      RAIL_PROVIDER: ${RAIL_PROVIDER}
      RAIL_DATA_BASE_URL: ${RAIL_DATA_BASE_URL}
      RAIL_DATA_ALLOWED_HOSTS: ${RAIL_DATA_ALLOWED_HOSTS}
      RAIL_DATA_API_KEY: ${RAIL_DATA_API_KEY}
      RAIL_DATA_API_KEY_FILE: ${RAIL_DATA_API_KEY_FILE}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      RAIL_CACHE_TTL: ${RAIL_CACHE_TTL}
      RAIL_REFRESH_SECONDS: ${RAIL_REFRESH_SECONDS}
    ports:
      - "${RAIL_HOST_PORT}:8080"
    volumes:
      - rail-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  rail-data:
    name: ${RAIL_VOLUME_NAME}
